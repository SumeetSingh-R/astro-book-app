[build]
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Swiss Ephemeris loads its .wasm and .data files from disk next to its own code,
  # so it must stay an un-bundled module with those files shipped alongside.
  # web-push is an older-style module that loads its parts at run time, so it is shipped as it is too.
  external_node_modules = ["swisseph-wasm", "web-push"]
  included_files = ["node_modules/swisseph-wasm/wasm/**"]
